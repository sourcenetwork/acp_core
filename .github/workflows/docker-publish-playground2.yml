name: Publish Docker Playground2 image

# Builds and publishes the playground service image (Playground2 + Alloy + the acp CLI) on every push, from any
# branch, while the playground is developed on feature branches. Images are tagged with the branch and the commit.
on:
  push:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sourcenetwork/acp_playground2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the branch (feat/policy-builder -> feat-policy-builder) and the commit (sha-e1619f9)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      # The build stages cross-compile and the final stage runs nothing, so arm64 needs no emulation
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./playground2.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
